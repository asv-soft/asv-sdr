name: Build and Publish Debug Version

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-dev"

env:
  PATH_TO_PROJECTS: ${{ github.workspace }}\src
  PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}\output\
  NUGET_SOURCE_URL: 'https://api.nuget.org/v3/index.json'
  GITHUB_PACKAGES_URL: 'https://nuget.pkg.github.com/asv-soft/index.json'
  PROJECT_NAME: 'Asv.Sdr'

jobs:
  deploy:
    name: 'Deploy'
    runs-on: windows-2019
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.x.x

      - name: Set version variable
        env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $newTag = $env:TAG
          $newTag = $newTag.TrimStart("v")
          echo "VERSION=$newTag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checking version
        run: echo ${{ env.VERSION }}

      - name: Setting the project version
        run: |
          dotnet tool install -g dotnet-setversion    
          setversion ${{ env.VERSION }} ${{ env.PATH_TO_PROJECTS }}\Asv.Sdr\Asv.Sdr.csproj
          setversion ${{ env.VERSION }} ${{ env.PATH_TO_PROJECTS }}\Asv.Sdr.LimeSdr\Asv.Sdr.LimeSdr.csproj
          setversion ${{ env.VERSION }} ${{ env.PATH_TO_PROJECTS }}\Asv.Sdr.SignalHound\Asv.Sdr.SignalHound.csproj 
          
      - name: Add NuGet source
        run: |
          dotnet nuget add source ${{ env.GITHUB_PACKAGES_URL }} --username '${{ secrets.USER_NAME }}' --password '${{ secrets.GIHUB_NUGET_AUTH_TOKEN }}' --store-password-in-clear-text

      - name: Restoring dependencies
        run: |
          cd src    
          dotnet restore ${{ env.PATH_TO_PROJECTS }}/${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj    
          dotnet restore ${{ env.PATH_TO_PROJECTS }}/${{ env.PROJECT_NAME }}.LimeSdr/${{ env.PROJECT_NAME }}.LimeSdr.csproj
          dotnet restore ${{ env.PATH_TO_PROJECTS }}/${{ env.PROJECT_NAME }}.SignalHound/${{ env.PROJECT_NAME }}.SignalHound.csproj    

      - name: Building projects
        run: |
          cd src    
          dotnet build ${{ env.PATH_TO_PROJECTS }}/${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj -c Release --no-restore
          dotnet build ${{ env.PATH_TO_PROJECTS }}/${{ env.PROJECT_NAME }}.LimeSdr/${{ env.PROJECT_NAME }}.LimeSdr.csproj -c Release --no-restore
          dotnet build ${{ env.PATH_TO_PROJECTS }}/${{ env.PROJECT_NAME }}.SignalHound/${{ env.PROJECT_NAME }}.SignalHound.csproj -c Release --no-restore    

      - name: Packing projects to Nuget
        run: |
          cd src    
          dotnet pack ${{ env.PATH_TO_PROJECTS }}/${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj -c Release --no-build --no-restore -p:PackageVersion=${{ env.VERSION }} --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }}
          dotnet pack ${{ env.PATH_TO_PROJECTS }}/${{ env.PROJECT_NAME }}.LimeSdr/${{ env.PROJECT_NAME }}.LimeSdr.csproj -c Release --no-build --no-restore -p:PackageVersion=${{ env.VERSION }} --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }}
          dotnet pack ${{ env.PATH_TO_PROJECTS }}/${{ env.PROJECT_NAME }}.SignalHound/${{ env.PROJECT_NAME }}.SignalHound.csproj -c Release --no-build --no-restore -p:PackageVersion=${{ env.VERSION }} --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }}    

      - name: Pushing packages to Github   
        run: |    
          cd src    
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}Asv.Sdr.${{ env.VERSION }}.nupkg -k ${{ secrets.GIHUB_NUGET_AUTH_TOKEN }} --skip-duplicate -s ${{ env.GITHUB_PACKAGES_URL }}
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}Asv.Sdr.LimeSdr.${{ env.VERSION }}.nupkg -k ${{ secrets.GIHUB_NUGET_AUTH_TOKEN }} --skip-duplicate -s ${{ env.GITHUB_PACKAGES_URL }}
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}Asv.Sdr.SignalHound.${{ env.VERSION }}.nupkg -k ${{ secrets.GIHUB_NUGET_AUTH_TOKEN }} --skip-duplicate -s ${{ env.GITHUB_PACKAGES_URL }}
